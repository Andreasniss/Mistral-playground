name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install Python and locked dependencies
        run: uv sync --locked --dev
      - name: Compile Python sources
        run: uv run python -m compileall -q .
      - name: Lint
        run: uv run ruff check .
      - name: Run tests without credentials
        env:
          LLM_BACKEND: api
          MISTRAL_API_KEY: ""
          OTEL_ENABLED: "false"
        run: uv run pytest -q
      - name: Run deterministic evaluation contract
        run: uv run python -m evals.run_evals
